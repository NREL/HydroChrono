hydrodynamics:
  bodies:
    - name: body1
      h5_file: hydroData/rm3.h5

    - name: body2
      h5_file: hydroData/rm3.h5

  waves:
    type: irregular
    eta_file: ../../verification/rm3_mooring/inputs/eta_rm3_mooring.txt
    ramp_duration: 40.0
    ramp_type: cosine
    frequency_min: 0.001
